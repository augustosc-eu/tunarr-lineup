services:
  lineup:
    build: .
    container_name: tunarr-lineup
    restart: unless-stopped
    environment:
      TUNARR_URL: http://host.docker.internal:8000
      # Optional:
      # LINEUP_PASSWORD: change-me
      # LINEUP_USERNAME: lineup
    volumes:
      - lineup-data:/data
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  lineup-data: