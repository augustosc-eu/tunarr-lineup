name: Release

# Publishing a GitHub release (tag vYEAR.MONTH.N, e.g. v2026.10.3: no leading
# zero on the month, so it stays valid semver) builds the companion image for
# amd64 and arm64 and pushes it to GitHub Container Registry as
# ghcr.io/<owner>/<repo>:2026.10.3, :2026.10 (that month's latest) and :latest.
# Rebuilding an old tag by hand leaves :latest alone.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v2026.10.1
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Only the rule below may add :latest; metadata-action's own
          # flavor would add it to every semver build, hand rebuilds included.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=Tunarr Lineup
            org.opencontainers.image.description=A Mac OS 9-styled, TV-remote-friendly programming desk for Tunarr channels
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Published image answers its healthcheck
        run: |
          image="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
          docker run -d --name lineup -p 3000:3000 "$image"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/healthz && exit 0; sleep 1; done
          docker logs lineup
          exit 1
