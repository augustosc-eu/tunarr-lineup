name: Android

# Builds the Android app (android/, D60) as one APK for phones, tablets and
# Android TV. On a published release it is attached to the release; a hand run
# (Actions → Android → Run workflow) with no tag just builds the chosen branch
# and keeps the APK as a workflow artifact for 14 days.
#
# Signing uses the repository secrets ANDROID_KEYSTORE_BASE64 (a PKCS#12
# keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD. Android only updates an installed app from an APK signed
# with the same key, so keep the keystore backed up. Without the secrets the APK
# is signed with a throwaway debug key (fine for trying it out, not for updates).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)build and attach to, e.g. v2026.10.15. Leave empty to only build the chosen branch.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key and can't update an installed copy."
          fi
      - name: Build the APK
        run: ./gradlew testReleaseUnitTest assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name it like the other downloads
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk "dist-android/Tunarr-Lineup-$version-android.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@v7
        with:
          name: tunarr-lineup-android
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist-android/*.apk --clobber
