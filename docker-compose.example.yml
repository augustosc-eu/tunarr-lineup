# Example: run Tunarr and the Lineup companion on one Docker network.
#
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d
#
# Then open Lineup at http://localhost:3000 (Tunarr itself stays at :8000).
# The browser only talks to Lineup; Lineup reaches Tunarr as http://tunarr:8000
# over the private "tunarr" network.

services:
  tunarr:
    image: chrisbenincasa/tunarr:latest
    # The published image is amd64-only; uncomment on Apple silicon / arm64.
    # platform: linux/amd64
    container_name: tunarr
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=America/New_York
    volumes:
      # Keep your existing Tunarr data directory here.
      - ./tunarr-data:/config/tunarr
      # The filler videos uploaded from Lineup (Setup → Filler Folders), shared
      # with the lineup service. Lineup adds it to Tunarr as a local source.
      - lineup-media:/media/lineup
    networks:
      - tunarr

  lineup:
    image: ghcr.io/augustosc-eu/tunarr-lineup:latest
    # Or build from this repository instead:
    # build: .
    container_name: tunarr-lineup
    restart: unless-stopped
    depends_on:
      - tunarr
    # No settings needed here. On the first start, open Lineup and type the
    # setup code from `docker logs tunarr-lineup`; the setup wizard finds
    # Tunarr at http://tunarr:8000 and asks for a user name and password.
    # Everything else (AI, the upload folder, scheduled changes) is optional
    # and set in the wizard or later under Setup → Server Settings, kept in
    # config.json in the lineup-data volume.
    # environment:
      # Older installs: TUNARR_URL, LINEUP_PASSWORD, LINEUP_AI_* and the rest
      # are copied into config.json on the first start, then ignored.
      # - TUNARR_URL=http://tunarr:8000
    volumes:
      # Lineup's settings (config.json), saved templates and the rest. A named
      # volume, so the container's non-root user owns it.
      - lineup-data:/data
      # The filler upload folder, shared with Tunarr: choose /media/lineup as
      # the media folder in setup. To use a host folder instead (e.g.
      # ./filler-media), mount it here and in tunarr, and make it writable by
      # uid 1000: sudo chown 1000:1000 filler-media
      - lineup-media:/media/lineup
    ports:
      # Lineup can rewrite channel programming. Use "127.0.0.1:3000:3000"
      # to keep it reachable from this machine only.
      - "3000:3000"
    networks:
      - tunarr

networks:
  tunarr:

volumes:
  lineup-data:
  lineup-media:
