# Example: run Tunarr and the Lineup companion on one Docker network.
#
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d
#
# Then open Lineup at http://localhost:3000 (Tunarr itself stays at :8000).
# The browser only talks to Lineup; Lineup reaches Tunarr as http://tunarr:8000
# over the private "tunarr" network.

services:
  tunarr:
    image: chrisbenincasa/tunarr:latest
    # The published image is amd64-only; uncomment on Apple silicon / arm64.
    # platform: linux/amd64
    container_name: tunarr
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=America/New_York
    volumes:
      # Keep your existing Tunarr data directory here.
      - ./tunarr-data:/config/tunarr
      # The filler videos uploaded from Lineup (Setup → Filler Folders), shared
      # with the lineup service. Lineup adds it to Tunarr as a local source.
      - lineup-media:/media/lineup
    networks:
      - tunarr

  lineup:
    image: ghcr.io/augustosc-eu/tunarr-lineup:latest
    # Or build from this repository instead:
    # build: .
    container_name: tunarr-lineup
    restart: unless-stopped
    depends_on:
      - tunarr
    environment:
      # Server-side only. Must be the address Tunarr has on this network.
      - TUNARR_URL=http://tunarr:8000
      # Optional: require sign-in (HTTP Basic). Strongly recommended if
      # Lineup is reachable by anyone other than you.
      # - LINEUP_PASSWORD=change-me
      # - LINEUP_USERNAME=lineup
      # Without sign-in, Lineup answers only to IP addresses and localhost.
      # Add the names you open it by (e.g. nas.local or your proxy's domain):
      # - LINEUP_ALLOWED_HOSTS=nas.local,lineup.home.example
      # Optional: upstream timeouts in milliseconds.
      # - TUNARR_TIMEOUT_MS=10000
      # - TUNARR_SAVE_TIMEOUT_MS=30000
      # - LINEUP_EXTERNAL_LOGOS=false   # only show logos Tunarr hosts itself
      # Optional: AI programming assistant (Channel → Programming Templates → Ask AI).
      # Anthropic:
      # - LINEUP_AI_PROVIDER=anthropic
      # - LINEUP_AI_API_KEY=sk-ant-...
      # - LINEUP_AI_MODEL=claude-sonnet-5-5
      # Or any OpenAI-compatible API, e.g. a local Ollama:
      # - LINEUP_AI_PROVIDER=openai
      # - LINEUP_AI_BASE_URL=http://ollama:11434/v1
      # - LINEUP_AI_MODEL=llama3.1
      # Upload station IDs, commercials and promos from Setup → Filler Folders.
      # The lineup-media volume is mounted at the same path in both containers.
      # Remove this line to turn uploads off. If Tunarr sees the folder at a
      # different path, set LINEUP_MEDIA_TUNARR_DIR to it.
      - LINEUP_MEDIA_DIR=/media/lineup
      # - LINEUP_MEDIA_MAX_MB=4096
    volumes:
      # Saved programming templates. A named volume, so the container's
      # non-root user owns it.
      - lineup-data:/data
      # The filler upload folder, shared with Tunarr. To use a host folder
      # instead (e.g. ./filler-media), mount it here and in tunarr, and make
      # it writable by uid 1000: sudo chown 1000:1000 filler-media
      - lineup-media:/media/lineup
    ports:
      # Lineup can rewrite channel programming. Use "127.0.0.1:3000:3000"
      # to keep it reachable from this machine only.
      - "3000:3000"
    networks:
      - tunarr

networks:
  tunarr:

volumes:
  lineup-data:
  lineup-media:
